<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatusRows — preview</title>
<style>html,body{margin:0;background:var(--shell);}</style></head>
<body>
<div id="root" class="lw" style="padding:24px"></div>
<script>
  /* Alle tekster og tall hentes fra datasettet i bundle.js (Lonewatch.data). */
  var L = window.Lonewatch, h = React.createElement, D = L.data, t = D.text.no, n = D.counts;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { style: { width: 376 } }, h(L.Panel, null, h(L.StatusRows, { rows: [{ label: t.sandboxRow, status: t.sandboxStatus.replace('{tested}', D.sandbox.tested).replace('{blocked}', D.sandbox.blocked) }, { label: t.logRow, status: t.status.ok }] }))));
</script>
</body>
</html>
