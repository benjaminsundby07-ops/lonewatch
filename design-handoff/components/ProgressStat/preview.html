<!doctype html>
<html>
<head><meta charset="utf-8"><title>ProgressStat — preview</title>
<style>html,body{margin:0;background:var(--shell);}</style></head>
<body>
<div id="root" class="lw" style="padding:24px"></div>
<script>
  /* Alle tekster og tall hentes fra datasettet i bundle.js (Lonewatch.data). */
  var L = window.Lonewatch, h = React.createElement, D = L.data, t = D.text.no, n = D.counts;
  ReactDOM.createRoot(document.getElementById('root')).render(h('section', { className: 'lw-panel lw-progress-row', style: { width: 640 } }, h(L.ProgressStat, { icon: 'alert', label: t.waiting, value: n.waitingForHuman + ' ' + t.of + ' ' + n.red, progress: n.waitingForHuman / n.red }), h('span', { className: 'lw-divider-v' }), h(L.ProgressStat, { icon: 'check', label: t.followed, value: n.followedUp + ' ' + t.of + ' ' + n.red, progress: n.followedUp / n.red })));
</script>
</body>
</html>
