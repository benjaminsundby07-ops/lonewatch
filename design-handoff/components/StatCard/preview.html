<!-- @dsCard group="Data" height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>StatCard — preview</title>
<style>html,body{margin:0;background:var(--shell);}</style></head>
<body>
<div id="root" class="lw" style="padding:24px"></div>
<script>
  /* Alle tekster og tall hentes fra datasettet i bundle.js (Lonewatch.data). */
  var L = window.Lonewatch, h = React.createElement, D = L.data, t = D.text.no, n = D.counts;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'lw-stats', style: { width: 640 } }, [0, 1, 2].map(function (i) { var sh = D.chartShapes[i], v = [n.evaluated, n.red, n.blocked][i]; return h(L.StatCard, { key: i, title: t.stats[i], value: String(v), rows: i === 0 ? [{ label: t.allowed, value: String(n.allowed) }] : [], data: sh.data, ghost: sh.ghost, marks: sh.marks, color: ['var(--chart-1)', 'var(--chart-2)', 'var(--chart-3)'][i] }); })));
</script>
</body>
</html>
